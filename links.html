  <style>
    /* Page-specific layout; palette, type, and buttons come from styles.css. */
    body{position:relative;min-height:100vh;min-height:100svh;isolation:isolate}
    .links-sky{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:-1;color:var(--ink)}
    .links-sky svg{position:absolute;width:clamp(650px,145vw,1100px);height:auto;max-width:none;left:50%;top:45%;transform:translate(-50%,-50%);opacity:.065;fill:none;stroke:currentColor;stroke-width:1;stroke-linecap:round;stroke-linejoin:round}
    .links-main{position:relative;width:100%;max-width:560px;margin:0 auto;padding:52px 6%;text-align:center}
    .links-main h1{font-family:var(--sans);font-size:14px;line-height:1.6;font-weight:600;letter-spacing:2.4px}
    .links-main h1 span{font-weight:400}
    .links-description{font-size:18px;line-height:1.65;margin-top:20px}
    .links-buttons{display:flex;flex-direction:column;gap:16px;margin-top:30px}
    .links-buttons .button{width:100%;margin-top:0;min-height:56px;justify-content:space-between;gap:16px;line-height:1.5;overflow-wrap:anywhere;text-align:left}
    .links-buttons .button span{flex-shrink:0}
    @media(min-width:768px){.links-main{padding:76px 24px}}
  </style>
</head>
